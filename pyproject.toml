[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bwf"
version = "0.2.0"
description = "Point-in-time Elo and machine learning for badminton singles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.3,<4",
    "numpy>=2.1.3,<3",
    "scikit-learn>=1.5.2,<2",
    "matplotlib>=3.9.2,<4",
    "streamlit>=1.57,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3,<10", "ruff>=0.7.4,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
